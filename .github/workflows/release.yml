name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app and DMG
        run: make dmg

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GlassClip.dmg
          generate_release_notes: true
